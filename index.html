<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Student Enrollment Form</h1>
        <p class="subtitle">School Database - Student Table</p>

        <div id="message" class="message"></div>

        <form id="studentForm" novalidate>
            <div class="form-grid">
                <div class="field">
                    <label for="roll_no">Roll No <span>*</span></label>
                    <input type="number" id="roll_no" name="roll_no"
                           placeholder="Enter Roll No" min="1" required autofocus>
                </div>

                <div class="field">
                    <label for="full_name">Full Name <span>*</span></label>
                    <input type="text" id="full_name" name="full_name"
                           placeholder="Enter full name" required disabled>
                </div>

                <div class="field">
                    <label for="student_class">Class <span>*</span></label>
                    <input type="text" id="student_class" name="student_class"
                           placeholder="Enter class" required disabled>
                </div>

                <div class="field">
                    <label for="birth_date">Birth Date <span>*</span></label>
                    <input type="date" id="birth_date" name="birth_date"
                           required disabled>
                </div>

                <div class="field full-width">
                    <label for="address">Address <span>*</span></label>
                    <textarea id="address" name="address"
                              placeholder="Enter address" rows="3"
                              required disabled></textarea>
                </div>

                <div class="field">
                    <label for="enrollment_date">Enrollment Date <span>*</span></label>
                    <input type="date" id="enrollment_date"
                           name="enrollment_date" required disabled>
                </div>
            </div>

            <div class="buttons">
                <button type="button" id="saveBtn" class="save" disabled>Save</button>
                <button type="button" id="updateBtn" class="update" disabled>Update</button>
                <button type="button" id="resetBtn" class="reset" disabled>Reset</button>
            </div>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
